{% extends "admin/base.html" %}
{% load sentinel %}
{% block title %}評分變動紀錄 | {{ site_title }}{% endblock %}
{% block content %}
<div class="ms">
  <div class="ms-head">
    <div><h1>評分變動紀錄</h1>
      <p class="ms-sub">新 MR → review → 寫入資料庫 → 重算個人與團隊分數;有變才記一筆。原因欄寫的是觸發這次重算的事件。</p></div>
    <form method="get" class="ms-row">
      <select name="person" aria-label="對象" onchange="this.form.submit()"><option value="">所有人</option>
        <option value="-1" {% if person == -1 %}selected{% endif %}>團隊</option>
        {% for p in people %}<option value="{{ p.gitlab_id }}" {% if person == p.gitlab_id %}selected{% endif %}>{{ p.name|default:p.username }}</option>{% endfor %}</select>
      <noscript><button type="submit">篩選</button></noscript>
    </form>
  </div>
  <div class="ms-list-wrap" style="padding:4px 16px">
    {% include "reviews/_events.html" with events=events compact=False %}
  </div>
</div>
{% endblock %}
